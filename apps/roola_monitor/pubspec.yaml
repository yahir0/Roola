name: roola_monitor
description: "Roola Monitor — Roola のアクティビティモニタ（計器盤）を単体で動かす macOS アプリ（ADR-0069）。"
publish_to: 'none'

# Roola 本体とは独立したバージョン（ADR-0069 D7）。
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  hooks_riverpod: ^3.3.1
  path_provider: ^2.1.5

  # 同一リポジトリ内の共通パッケージ（ADR-0069）。Roola 本体と共有する。
  polaris:
    path: ../../packages/polaris
  roola_activity:
    path: ../../packages/roola_activity

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
