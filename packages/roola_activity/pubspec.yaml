name: roola_activity
description: "Roola 系アプリ共通のアクティビティモニタ（計測プラグイン・計器盤・計器書体 / ADR-0067・ADR-0069）。"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  freezed_annotation: ^3.1.0
  hooks_riverpod: ^3.3.1
  json_annotation: ^4.11.0
  polaris:
    path: ../polaris
  riverpod_annotation: ^4.0.2

dev_dependencies:
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3

flutter:
  # 計測のネイティブ実装（design D4）。Windows は当面 Roola の Runner が
  # 同名チャネルに応答するため、ここには macOS だけを宣言する。
  plugin:
    platforms:
      macos:
        pluginClass: RoolaActivityPlugin

  # 計器書体（ADR-0067 D6 / SIL OFL 1.1）。参照名は
  # `packages/roola_activity/<family>`（meter_text.dart の定数を使う）。
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Regular.ttf
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700

  # 計器書体の OFL 本文（registerActivityLicenses で登録する）。
  assets:
    - assets/licenses/
